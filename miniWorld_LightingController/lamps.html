<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Lamp hardware</title>
<style>
  /* Served from the device's flash, so: no web fonts, no frameworks,
     nothing fetched from outside the LAN. */
  :root {
    --ink: #1f2a30;
    --mute: #6b7a82;
    --line: #d5dce0;
    --ok: #1f7a3a;
    --bad: #a83a2c;
    --act: #0f5f8c;
    --act-ink: #ffffff;
    --field: #f3f6f7;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font: 15px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    color: var(--ink);
    background: #fff;
  }
  main { max-width: 34rem; margin: 0 auto; padding: 2rem 1.25rem 4rem; }
  h1 { font-size: 1.35rem; font-weight: 600; margin: 0 0 .25rem; }
  p.lead { color: var(--mute); margin: 0 0 1.75rem; }

  /* The one element that matters: what is fitted versus what is configured. */
  .found {
    border-left: 4px solid var(--line);
    padding: .75rem 1rem;
    margin: 0 0 1.75rem;
    background: var(--field);
  }
  .found.match { border-color: var(--ok); }
  .found.differs { border-color: var(--bad); }
  .found strong { font-weight: 600; }
  .found .sub { color: var(--mute); }

  fieldset { border: 0; padding: 0; margin: 0 0 1.25rem; }
  legend { font-weight: 600; padding: 0; margin-bottom: .5rem; }
  label { display: block; margin-bottom: .75rem; }
  label span { display: block; margin-bottom: .2rem; }
  select, input[type=number] {
    width: 100%;
    font: inherit;
    padding: .45rem .6rem;
    border: 1px solid var(--line);
    border-radius: 4px;
    background: #fff;
    color: var(--ink);
  }
  label.check { display: flex; gap: .6rem; align-items: baseline; }
  label.check span { margin: 0; }
  .hint { color: var(--mute); font-size: .9rem; margin: -.4rem 0 .9rem; }
  .only { display: none; }
  .only.show { display: block; }

  .actions { display: flex; flex-wrap: wrap; gap: .6rem; margin-top: 1.5rem; }
  button {
    font: inherit;
    padding: .55rem 1rem;
    border-radius: 4px;
    border: 1px solid var(--line);
    background: #fff;
    color: var(--ink);
    cursor: pointer;
  }
  button.primary { background: var(--act); color: var(--act-ink); border-color: var(--act); }
  button:focus-visible, select:focus-visible, input:focus-visible {
    outline: 2px solid var(--act); outline-offset: 2px;
  }
  button:disabled { opacity: .5; cursor: default; }

  .status { margin-top: 1.25rem; min-height: 1.5rem; }
  .status.ok { color: var(--ok); }
  .status.bad { color: var(--bad); }
  .faults { margin: .5rem 0 0; padding: 0; list-style: none; display: flex; flex-wrap: wrap; gap: .3rem; }
  .faults li {
    width: 1.9rem; text-align: center; font-size: .85rem;
    border: 1px solid var(--line); border-radius: 3px; padding: .1rem 0;
  }
  .faults li.bad { border-color: var(--bad); color: var(--bad); }
  @media (prefers-reduced-motion: no-preference) {
    .found { transition: border-color .2s; }
  }
</style>
</head>
<body>
<main>
  <h1>Lamp hardware</h1>
  <p class="lead">Tell the controller which lamp driver boards are fitted. Changes take effect immediately and are kept after a restart.</p>

  <div class="found" id="found">
    <strong id="foundHead">Not detected yet</strong>
    <div class="sub" id="foundSub">Use Detect to look for boards on the bus. The lamps go dark for a moment while it runs.</div>
  </div>

  <form id="form" onsubmit="return false">
    <fieldset>
      <legend>Driver board</legend>
      <label>
        <span>Type</span>
        <select id="hardware">
          <option value="none">None fitted</option>
          <option value="sx1503">SX1503 expanders, one per bus, on/off</option>
          <option value="al5887">AL5887 LED drivers, dimmable</option>
        </select>
      </label>
      <label>
        <span>Number of boards</span>
        <input type="number" id="devices" min="1" max="12" value="1">
      </label>
      <div class="hint" id="devHint"></div>
      <label>
        <span>Bus speed</span>
        <select id="busSpeed">
          <option value="100000">100 kHz</option>
          <option value="400000">400 kHz</option>
          <option value="1000000">1 MHz</option>
        </select>
      </label>
    </fieldset>

    <fieldset class="only" id="sxOnly">
      <legend>SX1503 wiring</legend>
      <label class="check">
        <input type="checkbox" id="activeLow">
        <span>LED cathode is on the expander pin (a low output turns the lamp on)</span>
      </label>
    </fieldset>

    <fieldset class="only" id="alOnly">
      <legend>AL5887 wiring</legend>
      <label class="check">
        <input type="checkbox" id="rgb">
        <span>Channels are wired as 12 RGB modules per board</span>
      </label>
    </fieldset>

    <div class="actions">
      <button type="button" id="detect">Detect</button>
      <button type="button" id="testOn">All lamps on</button>
      <button type="button" id="testOff">All lamps off</button>
      <button type="button" class="primary" id="save">Save and apply</button>
    </div>
    <div class="status" id="status"></div>
    <ul class="faults" id="faults"></ul>
  </form>
</main>

<script>
(function () {
  const $ = id => document.getElementById(id);
  const api = p => '/api/lamps/' + p;
  const limits = { none: 0, sx1503: 12, al5887: 4 };
  const perDev = { none: 0, sx1503: 16, al5887: 36 };
  let detected = null;

  function say(msg, cls) {
    const s = $('status');
    s.textContent = msg;
    s.className = 'status ' + (cls || '');
  }

  function readForm() {
    return {
      hardware:  $('hardware').value,
      devices:   parseInt($('devices').value, 10) || 0,
      busSpeed:  parseInt($('busSpeed').value, 10),
      activeLow: $('activeLow').checked,
      rgb:       $('rgb').checked
    };
  }

  function writeForm(c) {
    $('hardware').value = c.hardware;
    $('devices').value = c.devices || 1;
    $('busSpeed').value = c.busSpeed;
    $('activeLow').checked = !!c.activeLow;
    $('rgb').checked = !!c.rgb;
    refresh();
  }

  function refresh() {
    const hw = $('hardware').value;
    const max = limits[hw];
    $('devices').max = max || 1;
    $('devices').disabled = hw === 'none';
    $('sxOnly').classList.toggle('show', hw === 'sx1503');
    $('alOnly').classList.toggle('show', hw === 'al5887');
    const n = parseInt($('devices').value, 10) || 0;
    $('devHint').textContent = hw === 'none' ? ''
      : `Up to ${max}. ${n} board${n === 1 ? '' : 's'} gives ${n * perDev[hw]} lamps.`;
    compare();
  }

  function compare() {
    const box = $('found');
    if (!detected) { box.className = 'found'; return; }
    const f = readForm();
    const same = detected.hardware === f.hardware && detected.devices === f.devices;
    box.className = 'found ' + (same ? 'match' : 'differs');
    $('foundSub').textContent = same
      ? 'Matches the settings below.'
      : 'Differs from the settings below. Save and apply to use what was detected, or adjust the settings.';
  }

  function showFaults(st) {
    const ul = $('faults');
    ul.innerHTML = '';
    (st.faults || []).forEach((bad, i) => {
      const li = document.createElement('li');
      li.textContent = i + 1;
      li.className = bad ? 'bad' : '';
      li.title = bad ? 'Board ' + (i + 1) + ' did not respond' : 'Board ' + (i + 1) + ' OK';
      ul.appendChild(li);
    });
  }

  async function call(method, p, body) {
    const r = await fetch(api(p), {
      method, headers: { 'Content-Type': 'application/json' },
      body: body ? JSON.stringify(body) : undefined
    });
    const j = await r.json().catch(() => ({}));
    if (!r.ok) throw new Error(j.error || ('HTTP ' + r.status));
    return j;
  }

  async function load() {
    try {
      const c = await call('GET', 'config');
      writeForm(c);
      const st = await call('GET', 'status');
      showFaults(st);
      say(st.lamps ? `${st.lamps} lamps running.` : 'No lamp hardware configured.');
    } catch (e) {
      say('Could not read settings: ' + e.message, 'bad');
    }
  }

  $('detect').onclick = async () => {
    $('detect').disabled = true;
    say('Looking for boards.');
    try {
      detected = await call('POST', 'probe');
      if (detected.hardware === 'none') {
        $('foundHead').textContent = 'No boards found';
        $('foundSub').textContent = 'Nothing answered on any bus. Check power and wiring, then try again.';
      } else {
        const name = detected.hardware === 'sx1503' ? 'SX1503' : 'AL5887';
        $('foundHead').textContent = `Found ${detected.devices} ${name} board${detected.devices === 1 ? '' : 's'}`;
        writeForm(detected);
      }
      say('');
    } catch (e) {
      say('Detect failed: ' + e.message, 'bad');
    }
    $('detect').disabled = false;
  };

  $('save').onclick = async () => {
    try {
      const st = await call('PUT', 'config', readForm());
      showFaults(st);
      const bad = (st.faults || []).filter(x => x).length;
      say(bad ? `Saved. ${bad} board${bad === 1 ? '' : 's'} did not respond.` : `Saved. ${st.lamps} lamps running.`, bad ? 'bad' : 'ok');
    } catch (e) {
      say('Not saved: ' + e.message, 'bad');
    }
  };

  $('testOn').onclick = () => call('POST', 'test', { level: 255 }).then(() => say('All lamps on.')).catch(e => say(e.message, 'bad'));
  $('testOff').onclick = () => call('POST', 'test', { level: 0 }).then(() => say('All lamps off.')).catch(e => say(e.message, 'bad'));

  ['hardware', 'devices', 'busSpeed', 'activeLow', 'rgb'].forEach(id => $(id).addEventListener('input', refresh));
  load();
})();
</script>
</body>
</html>
